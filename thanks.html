<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nekonote - 支援完了・お礼メッセージ一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 共通のSupabase CDNを読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-amber-50/40 text-gray-800 min-h-screen flex flex-col">

  <!-- ヘッダー -->
  <header class="bg-white shadow-sm sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐾</span>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-amber-800 leading-tight">Nekonote サンクスレポート</h1>
          <p class="src text-[11px] text-gray-500">温かいご支援への感謝と、保護猫たちの近況報告</p>
        </div>
      </div>
      <a href="wishlist.html" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold px-3.5 py-2 rounded-full transition">
        物資支援リストへ戻る →
      </a>
    </div>
  </header>
<!-- 🔐 管理者専用：支援報告・お礼登録フォーム（デフォルトは hidden で非表示） -->
<section id="adminReportFormSection" class="hidden max-w-5xl mx-auto px-4 mb-8">
  <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-6 shadow-sm space-y-4">
    <h3 class="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
      <span>📝</span> <span>【管理者専用】新しい支援報告・お礼メッセージの登録</span>
    </h3>
    <form id="supportReportForm" onsubmit="handleSupportReportSubmit(event)" class="space-y-3 text-xs">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div>
          <label class="block font-bold text-gray-700 mb-1">支援者さまのお名前 <span class="text-red-500">*</span></label>
          <input type="text" id="reportDonorName" required placeholder="例: 山田 太郎 様" class="w-full px-3 py-2 rounded-lg border border-gray-300">
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">支援者さまのメールアドレス（任意・名簿用）</label>
          <input type="email" id="reportDonorEmail" placeholder="yamada@example.com" class="w-full px-3 py-2 rounded-lg border border-gray-300">
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">支援された物資のタイトル <span class="text-red-500">*</span></label>
          <input type="text" id="reportItemTitle" required placeholder="例: ロイヤルカナン 子猫用ミルク" class="w-full px-3 py-2 rounded-lg border border-gray-300">
        </div>
        <div>
          <label class="block font-bold text-gray-700 mb-1">個数・数量 <span class="text-red-500">*</span></label>
          <input type="number" id="reportQuantity" min="1" value="1" required class="w-full px-3 py-2 rounded-lg border border-gray-300">
        </div>
      </div>
      <div>
        <label class="block font-bold text-gray-700 mb-1">お礼・近況報告メッセージ <span class="text-red-500">*</span></label>
        <textarea id="reportMessage" rows="2" required placeholder="例: 温かいミルクをご支援いただきありがとうございます！みんな元気に育っています🐾" class="w-full px-3 py-2 rounded-lg border border-gray-300"></textarea>
      </div>
      <div class="flex justify-end">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-5 rounded-lg transition shadow-sm">
          ✨ 報告を登録して名簿＆活動ログに自動連動する
        </button>
      </div>
    </form>
  </div>
</section>
  <!-- ヒーローバナー -->
  <section class="bg-gradient-to-r from-emerald-600 to-teal-600 text-white py-8 px-4">
    <div class="max-w-5xl mx-auto text-center space-y-2">
      <h2 class="text-xl md:text-2xl font-bold">💌 届いた温かい想いと、猫たちの日常</h2>
      <p class="text-xs md:text-sm text-emerald-100 max-w-2xl mx-auto">
        皆様からのご支援により、保護猫たちに物資が届きました！団体スタッフからの感謝のメッセージと近況報告をご紹介します。
      </p>
    </div>
  </section>

  <!-- メインコンテンツ -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-sm font-bold text-gray-700">お礼・報告メッセージ一覧</h3>
      <p id="thanksCountDisplay" class="text-xs text-gray-500 font-medium">読み込み中...</p>
    </div>

    <!-- ローディング -->
    <div id="loadingState" class="text-center py-16 text-gray-500 text-sm">
      お礼メッセージを読み込んでいます...
    </div>

    <!-- サンクスカード一覧グリッド -->
    <div id="thanksGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>

  <!-- フッター -->
  <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500 mt-12">
    <p>🐾 Nekonote - 保護猫ボランティア支援プラットフォーム</p>
  </footer>

  <script>
    // ★Nekonoteと共通のSupabase接続情報
    const SUPABASE_URL = 'https://fknneasutspaonhvmsae.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bXjpXwx8EY2PBn3E6FqT8A_3s18sjFJ';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const thanksGrid = document.getElementById('thanksGrid');
    const loadingState = document.getElementById('loadingState');
    const thanksCountDisplay = document.getElementById('thanksCountDisplay');

    // お礼メッセージが入力されている物資だけを共通DBから取得
    async function loadThankYouItems() {
      loadingState.classList.remove('hidden');
      thanksGrid.innerHTML = '';

      try {
        const { data, error } = await supabaseClient
          .from('wishlist_items')
          .select(`
            *,
            animals ( name ),
            organizations!fk_wishlist_organization ( name, contact_info )
          `)
          .not('thank_you_note', 'is', null) // お礼メッセージが空でないもの
          .order('updated_at', { ascending: false });

        if (error) throw error;

        renderThanksItems(data || []);
      } catch (err) {
        console.error('読み込みエラー:', err);
        thanksGrid.innerHTML = `<p class="col-span-full text-center text-red-500 py-8 text-sm">データの取得に失敗しました: ${err.message}</p>`;
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    function renderThanksItems(items) {
      thanksCountDisplay.textContent = `全 ${items.length} 件のレポート`;
      thanksGrid.innerHTML = '';

      if (items.length === 0) {
        thanksGrid.innerHTML = `
          <div class="col-span-full bg-white rounded-xl p-10 text-center border border-gray-200 text-gray-500 text-sm">
            現在公開されているお礼メッセージはありません🐾
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const org = item.organizations || {};
        const orgName = org.name || '登録ボランティア団体';

        const card = document.createElement('article');
        card.className = 'bg-white rounded-xl p-5 shadow-sm border border-emerald-200 flex flex-col justify-between gap-4';

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between text-xs">
              <span class="font-bold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-full">🏠 ${escapeHtml(orgName)}</span>
              <span class="text-gray-400">支援物資: <strong>${escapeHtml(item.title)}</strong> (${item.current_quantity}個)</span>
            </div>

            <div class="bg-emerald-50/60 border border-emerald-100 rounded-lg p-3.5 space-y-1.5">
              <div class="flex items-center gap-1 font-bold text-emerald-900 text-xs">
                <span>💌</span> <span>団体からのありがとう・近況報告</span>
              </div>
              <p class="text-xs text-gray-700 leading-relaxed whitespace-pre-wrap">${escapeHtml(item.thank_you_note)}</p>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-100 text-[11px] text-gray-500 flex justify-between items-center">
            <span>対象: ${item.animals ? `🐱 ${escapeHtml(item.animals.name)} ちゃん` : '🏠 団体全体'}</span>
            <span class="text-emerald-700 font-medium">✨ 温かいご支援ありがとうございました！</span>
          </div>
        `;

        thanksGrid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }

    window.addEventListener('DOMContentLoaded', loadThankYouItems);
    // ページの読み込み時にログイン状態をチェックする
async function checkAuthAndInit() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  
  const adminFormSection = document.getElementById('adminReportFormSection');
  
  if (session && session.user) {
    // 🔐 ログイン中の場合：管理者用フォームを表示する
    if (adminFormSection) adminFormSection.classList.remove('hidden');
    console.log('管理者としてログイン中：入力フォームを表示します');
  } else {
    // 👤 未ログイン（一般・支援者）の場合：閲覧のみ（フォームは隠す）
    if (adminFormSection) adminFormSection.classList.add('hidden');
  }

  // サンクス一覧データの取得
  loadThankYouItems();
}

window.addEventListener('DOMContentLoaded', checkAuthAndInit);
    async function handleSupportReportSubmit(e) {
  e.preventDefault();

  const donorName = document.getElementById('reportDonorName').value.trim();
  const donorEmail = document.getElementById('reportDonorEmail').value.trim() || null;
  const itemTitle = document.getElementById('reportItemTitle').value.trim();
  const quantity = parseInt(document.getElementById('reportQuantity').value) || 1;
  const message = document.getElementById('reportMessage').value.trim();

  // 現在ログイン中のユーザー情報を取得（組織IDなどを紐付けるため）
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    alert('セッションが切れました。再度ログインしてください。');
    return;
  }
  
  // ログインユーザーの組織IDを取得する（profiles テーブル等から）
  const userId = session.user.id;
  const { data: profile } = await supabaseClient
    .from('profiles')
    .select('organization_id')
    .eq('id', userId)
    .maybeSingle();

  // 組織IDが決まっていない場合のフォールバック（最初の組織を取得するなど）
  let orgId = profile ? profile.organization_id : null;
  if (!orgId) {
    const { data: orgData } = await supabaseClient.from('organizations').select('id').limit(1).maybeSingle();
    if (orgData) orgId = orgData.id;
  }

  if (!orgId) {
    alert('紐づく団体情報が見つかりませんでした。');
    return;
  }

  try {
    // ==========================================
    // 1. 名簿（volunteers）への自動登録・重複チェック
    // ==========================================
    let volunteerId = null;
    let query = supabaseClient.from('volunteers').select('id').eq('organization_id', orgId);
    if (donorEmail) {
      query = query.eq('email', donorEmail);
    } else {
      query = query.eq('name', donorName);
    }
    const { data: existingVol } = await query.maybeSingle();

    if (existingVol) {
      volunteerId = existingVol.id;
    } else {
      const { data: newVol, error: volError } = await supabaseClient
        .from('volunteers')
        .insert([{
          organization_id: orgId,
          name: donorName,
          email: donorEmail,
          role: '寄付者・サポーター',
          member_type: 'donor' // 寄付者区分
        }])
        .select()
        .single();
      if (!volError && newVol) volunteerId = newVol.id;
    }

    // ==========================================
    // 2. 活動報告・寄付欄（activity_logs）への自動記録
    // ==========================================
    const { error: logError } = await supabaseClient
      .from('activity_logs')
      .insert([{
        organization_id: orgId,
        type: 'donation', // 物資寄付
        volunteer_name: donorName,
        category: 'フード', // 必要に応じて自動判定や選択式にしてもOK
        title: `【物資支援】${itemTitle} × ${quantity}個`,
        amount: quantity,
        details: message, // お礼メッセージ（掲示板に表示）
        status: 'approved' // 管理者入力なので即時承認
      }]);

    if (logError) throw logError;

    alert('🎉 支援報告の登録が完了しました！名簿と活動ログ、サンクス掲示板に反映されました🐾');
    
    // フォームをリセットして一覧を再読み込み
    document.getElementById('supportReportForm').reset();
    loadThankYouItems();

  } catch (err) {
    alert('登録エラー: ' + err.message);
  }
}
  </script>
</body>
</html>
